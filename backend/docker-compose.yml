version: '3.8'

services:
  research-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./research_engine.db:/app/research_engine.db
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - HOST=0.0.0.0
      - PORT=8000
      - CHROMA_DB_PATH=/app/chroma_data
      - SQLITE_DB_PATH=/app/research_engine.db
    restart: always

  frontend-stub:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html